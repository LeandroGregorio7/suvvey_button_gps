<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão de Rotas - Survey123</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100px; margin: 0; background: transparent; }
        
        .main-button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
            text-align: center;
            min-width: 250px;
        }
        .main-button:hover { background-color: #218838; transform: scale(1.02); }
        .main-button:active { transform: scale(0.98); }
        .main-button .icon { font-size: 1.5rem; margin-bottom: 5px; }

        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            overflow-y: auto;
        }
        .modal-content {
            background-color: #f4f4f9;
            margin: 5% auto;
            padding: 15px;
            width: 90%;
            max-width: 800px;
            border-radius: 12px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            z-index: 10001;
        }

        #map { height: 300px; width: 100%; border-radius: 8px; margin-bottom: 15px; }
        .search-box { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .list-container { background: white; border-radius: 8px; overflow: hidden; max-height: 400px; overflow-y: auto; }
        .item { padding: 15px; border-bottom: 1px solid #eee; display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
        .item:hover { background: #f9f9f9; }
        .item-title { font-weight: bold; color: #2c3e50; font-size: 0.95rem; }
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; text-align: center; text-decoration: none; font-weight: bold; font-size: 0.85rem; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-google { background-color: #4285F4; }
        .btn-waze { background-color: #33CCFF; }
    </style>
</head>

<button class="main-button" onclick="openModal()">

</div>

    let map, markers = [];
    let mapInitialized = false;

    function openModal() {
        document.getElementById('navModal').style.display = 'block';
        if (!mapInitialized) {
            setTimeout(initMap, 100);
            mapInitialized = true;
        }
    }

    function closeModal() {
        document.getElementById('navModal').style.display = 'none';
    }

    window.onclick = function(event) {
        const modal = document.getElementById('navModal');
        if (event.target == modal) {
            closeModal();
        }
    }

    function initMap() {
        map = L.map('map').setView([-15.7942, -47.8822], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        pontos.forEach(p => {
            const marker = L.marker([p.Lat, p.Lon]).addTo(map)
                .bindPopup(`<b>${p.Local}</b><br><br><a href="${p.G}" target="_blank">Google Maps</a> | <a href="${p.W}" target="_blank">Waze</a>`);
            markers.push({marker, local: p.Local});
        });
        
        renderList(pontos);
    }

    function renderList(data) {
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = '';
        data.forEach(p => {
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `
                <div class="item-title">${p.Local}</div>
                <div class="btn-group">
                    <a href="${p.G}" class="btn btn-google" target="_blank" onclick="event.stopPropagation()">Google Maps</a>
                    <a href="${p.W}" class="btn btn-waze" target="_blank" onclick="event.stopPropagation()">Waze</a>
                </div>
            `;
            item.onclick = () => {
                map.setView([p.Lat, p.Lon], 15);
                const m = markers.find(m => m.local === p.Local);
                if (m) m.marker.openPopup();
                document.querySelector('.modal-content').scrollTop = 0;
            };
            listDiv.appendChild(item);
        });
    }

    function filterList() {
        const term = document.getElementById('search').value.toLowerCase();
        const filtered = pontos.filter(p => p.Local.toLowerCase().includes(term));
        renderList(filtered);
        if (filtered.length > 0) {
            const visibleMarkers = markers.filter(m => filtered.some(f => f.Local === m.local)).map(m => m.marker);
            const group = new L.featureGroup(visibleMarkers);
            map.fitBounds(group.getBounds());
        }
    }
</script>
